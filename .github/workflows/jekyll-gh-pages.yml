name: Deploy Jekyll with GitHub Pages dependencies preinstalled
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ./blog
      # 1. Jekyllを一時フォルダ (../_jekyll_out) へビルド
      - name: Build with Jekyll
        working-directory: ./blog
        run: bundle exec jekyll build --destination ../_jekyll_out
      # 2. ルートにあるプレーンサイトを公開フォルダ (_site) へコピー
      - name: Copy plain site
        run: |
          mkdir -p _site
          rsync -av \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'blog' \
            --exclude '_site' \
            --exclude '_jekyll_out' \
            ./ ./_site/
      # 3. ビルドしたJekyll成果物を _site/blog/ へ結合
      - name: Merge Jekyll build into _site/blog
        run: |
          mkdir -p ./_site/blog
          cp -r ./_jekyll_out/* ./_site/blog/
      # 4. 合体した _site フォルダをアップロード
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
